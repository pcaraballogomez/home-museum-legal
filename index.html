<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Home Museum - Legal y Privacidad</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #1c1c1e;
            --accent-color: #0071e3;
            --secondary-text: #6e6e73;
            --border-color: #e5e5ea;
            --card-bg: #ffffff;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #f5f5f7;
                --accent-color: #2997ff;
                --secondary-text: #86868b;
                --border-color: #323236;
                --card-bg: #1c1c1e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding: 0 0 80px 0;
        }

        header {
            position: sticky;
            top: 0;
            background-color: rgba(253, 253, 253, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            transition: background-color 0.3s;
        }

        @media (prefers-color-scheme: dark) {
            header {
                background-color: rgba(18, 18, 18, 0.8);
            }
        }

        .header-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--secondary-text);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
        }

        .lang-btn:hover:not(.active) {
            border-color: var(--secondary-text);
            color: var(--text-color);
        }

        main {
            max-width: 800px;
            margin: 40px auto 0 auto;
            padding: 0 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .section-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .section-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.04);
        }

        .section-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-color);
            letter-spacing: -0.5px;
        }

        .section-content {
            font-size: 1.05rem;
            color: var(--text-color);
            white-space: pre-line; /* Keeps line breaks from the json value */
        }

        /* Styling links within text to look nice */
        .section-content a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .section-content a:hover {
            text-decoration: underline;
        }

        footer {
            max-width: 800px;
            margin: 40px auto 0 auto;
            padding: 0 24px;
            text-align: center;
            color: var(--secondary-text);
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .section-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <header>

            <div class="lang-switch">

        </div>

        <div id="content-area">
            <!-- Sections will be rendered here dynamically -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Pablo Caraballo Gómez</p>
    </footer>

.es</a>.\n\nProvider, Transfers, and Retention\nFirebase Analytics is provided by Google Ireland Limited for users in the European Economic Area. Data may be processed in other countries under the safeguards applicable to Google’s terms and data protection framework. Google Analytics is configured to retain user-level and event-level data for 14 months. Standard aggregated reports may remain available for longer. More information is available in <a href="https://firebase.google.com/support/privacy" target="_blank">Firebase’s privacy information</a>.\n\nIn-App Purchases\nIn-app purchases are processed exclusively by Apple Inc. through the App Store. Pablo Caraballo Gómez does not have access to your payment details at any time. Verified purchase events are sent to Firebase only when usage analytics is enabled. Apple's privacy policy governs how purchase data is handled and can be reviewed at: <a href="https://apple.com/legal/privacy" target="_blank">apple.com/legal/privacy</a>\n\nData Stored on Device\nApp preferences and your analytics choice are stored locally on your device. When analytics is enabled, the events described above are sent to Firebase.\n\nArtwork Delivery\nArtwork images are downloaded on demand through Apple's On-Demand Resources system, hosted on Apple's servers. This download process does not involve information that directly identifies you.\n\nChildren's Privacy\nHome Museum is not specifically directed at children and does not ask for accounts or direct identifying information. Analytics is activated only after an explicit choice, and applicable rules on children’s data continue to apply. The app contains no user-generated content or social features.\n\nChanges to This Policy\nThis privacy policy may be updated from time to time. Material changes will be reflected in an updated version of the app and, where required, we will ask for a new consent. Continued use of the app does not by itself constitute consent to a new optional analytics purpose.\n\nContact\nIf you have questions about this privacy policy or want to exercise your rights, please contact: <a href="mailto:homemuseumapp@gmail.com">homemuseumapp@gmail.com</a>`
                    },
                    {
                        title: "Terms of Use",
                        body: `By downloading or using Home Museum, you agree to be bound by these Terms of Use. If you do not agree, please do not use the app.\n\nLicence\nPablo Caraballo Gómez grants you a limited, non-exclusive, non-transferable, revocable licence to use Home Museum for personal, non-commercial purposes on Apple TV devices that you own or control, subject to these terms.\n\nIn-App Purchases\nHome Museum offers optional in-app purchases to unlock additional content (galleries). All purchases are processed by Apple and are final and non-refundable unless required by applicable law or Apple's own refund policies. You may restore previous purchases at any time using the 'Restore Purchases' option in Settings.\n\nApple End User Licence Agreement\nYour use of Home Museum is also subject to Apple's standard End User Licence Agreement (EULA), available at: <a href="https://apple.com/legal/internet-services/itunes/dev/stdeula" target="_blank">apple.com/legal/internet-services/itunes/dev/stdeula</a>\n\nProhibited Use\nYou may not: (a) reverse engineer, decompile, or disassemble the app or any part of it; (b) use the app for any unlawful purpose or in violation of any applicable regulations; (c) attempt to gain unauthorised access to any part of the app or its related infrastructure; (d) sublicence, sell, rent, or transfer your rights under this licence.\n\nDisclaimer of Warranties\nHome Museum is provided 'as is' and 'as available' without warranties of any kind, whether express or implied. Pablo Caraballo Gómez does not warrant that the app will be error-free, uninterrupted, or free of viruses or other harmful components.\n\nLimitation of Liability\nTo the fullest extent permitted by applicable law, Pablo Caraballo Gómez shall not be liable for any indirect, incidental, special, consequential, or punitive damages arising from your use of or inability to use the app.\n\nChanges to These Terms\nThese Terms of Use may be revised at any time. Updates will be published in new versions of the app on the App Store. Your continued use of the app constitutes acceptance of the updated terms.\n\nGoverning Law\nThese terms shall be governed by and construed in accordance with the laws of Spain, without regard to conflict of law principles.`

                    {
                        title: "Política de privacidad",
                        body: `Responsable del tratamiento\nEl responsable del tratamiento es Pablo Caraballo Gómez. Para consultas sobre esta política o para ejercer tus derechos, escribe a: <a href="mailto:homemuseumapp@gmail.com">homemuseumapp@gmail.com</a>\n\nHome Museum no requiere cuentas de usuario ni registro y no solicita tu nombre, correo electrónico, datos de pago ni otros datos que te identifiquen directamente.\n\nAnalítica de uso\nLa analítica de uso solo se activa si aceptas compartirla en la aplicación. Cuando está activa, Firebase Analytics, un servicio de Google, procesa un identificador aleatorio de instancia de la aplicación, el país aproximado, las interacciones con la aplicación, eventos de compra y datos técnicos como la versión, la compilación y el idioma. Utilizamos esta información para medir de forma agregada el uso y mejorar Home Museum. Los eventos de compra pueden incluir el producto, el precio y la moneda, pero nunca los datos de tu tarjeta ni otros datos de pago.\n\nNo utilizamos IDFA ni identificadores publicitarios, publicidad personalizada, Google Signals, Google Ads ni seguimiento entre aplicaciones. No utilizamos estos datos para crear perfiles publicitarios.\n\nBase jurídica y tu elección\nLa base jurídica de este tratamiento analítico es tu consentimiento. La analítica permanece desactivada hasta que eliges compartir datos. Puedes rechazarlo sin perder ninguna función principal ni ninguna compra. Puedes retirar tu consentimiento en cualquier momento desde Ajustes > Privacidad > Compartir análisis de uso.\n\nCuando retiras el consentimiento, se detienen los envíos analíticos futuros y se reinicia el estado analítico local. Los datos que ya se hayan enviado no se borran automáticamente. Puedes solicitar acceso, supresión u otro derecho aplicable escribiendo a nuestro correo. Como la aplicación no utiliza cuentas y el identificador es seudónimo, puede que no siempre sea posible localizar datos concretos. Atenderemos las solicitudes ección explícita y se aplican las normas de protección de datos de menores que correspondan. La aplicación no contiene contenido generado por usuarios ni funciones sociales.\n\nCambios en esta política\nEsta política de privacidad puede actualizarse ocasionalmente. Los cambios importantes se reflejarán en una versión actualizada de la aplicación y, cuando sea necesario, solicitaremos un nuevo consentimiento. El uso continuado de la aplicación no constituye por sí solo consentimiento para una nueva finalidad opcional de analítica.\n\nContacto\nSi tienes preguntas sobre esta política o quieres ejercer tus derechos, contacta con: <a href="mailto:homemuseumapp@gmail.com">homemuseumapp@gmail.com</a>`

                    {
                        title: "Condiciones de uso",
                        body: `Al descargar o utilizar Home Museum, aceptas quedar vinculado por estas Condiciones de Uso. Si no estás de acuerdo, por favor no utilices la aplicación.\n\nLicencia\nPablo Caraballo Gómez te otorga una licencia limitada, no exclusiva, intransferible y revocable para utilizar Home Museum con fines personales y no comerciales en los dispositivos Apple TV que poseas o controles, de acuerdo con estas condiciones.\n\nCompras integradas\nHome Museum ofrece compras integradas opcionales para desbloquear contenido adicional (galerías). Todas las compras son gestionadas por Apple y son definitivas y no reembolsables, salvo que la legislación aplicable o las políticas de reembolso de Apple dispongan lo contrario. Puedes restaurar compras anteriores en cualquier momento mediante la opción 'Restaurar compras' en Ajustes.\n\nContrato de licencia de usuario final de Apple\nEl uso de Home Museum está también sujeto al Contrato de licencia de usuario final (CLUF) estándar de Apple, disponible en: <a href="https://apple.com/legal/internet-services/itunes/dev/stdeula" target="_blank">apple.com/legal/internet-services/itunes/dev/stdeula</a>\n\nUso prohibido\nQueda prohibido: (a) aplicar ingeniería inversa, descompilar o desensamblar la aplicación o cualquier parte de ella; (b) utilizar la aplicación con fines ilegales o en vulneración de la normativa aplicable; (c) intentar obtener acceso no autorizado a cualquier parte de la aplicación o su infraestructura; (d) sublicenciar, vender, alquilar o ceder los derechos de esta licencia.\n\nExclusión de garantías\nHome Museum se proporciona 'tal cual' y 'según disponibilidad', sin garantías de ningún tipo, expresas o implícitas. Pablo Caraballo Gómez no garantiza que la aplicación esté libre de errores, sea ininterrumpida o esté exenta de virus u otros componentes dañinos.\n\nLimitación de responsabilidad\nEn la medida máxima permitida por la legislación aplicable, Pablo Caraballo Gómez no será responsable de ningún daño indirecto, incidental, especial, consecuente o punitivo derivado del uso o la imposibilidad de uso de la aplicación.\n\nCambios en estas condiciones\nEstas Condiciones de Uso pueden modificarse en cualquier momento. Las actualizaciones se publicarán en nuevas versiones de la app en el App Store. El uso continuado de la aplicación implica la aceptación de las condiciones actualizadas.\n\nLegislación aplicable\nEstas condiciones se regirán e interpretarán de acuerdo con las leyes de España, sin tener en cuenta sus disposiciones sobre conflicto de leyes.`

        function setLanguage(lang) {
            // Update document lang
            document.documentElement.lang = lang;
            
            // Toggle active buttons
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');

            // Set titles
            const langData = translations[lang];
            document.getElementById('page-title').innerText = "Home Museum - " + langData.title;
            document.getElementById('main-title').innerText = langData.title;
            document.getElementById('last-updated').innerText = langData.lastUpdated;

            // Render content card sections
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            langData.sections.forEach(section => {
                const card = document.createElement('div');
                card.className = 'section-card';

                const h2 = document.createElement('h2');
                h2.innerText = section.title;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'section-content';
                contentDiv.innerHTML = section.body;

                card.appendChild(h2);
                card.appendChild(contentDiv);
                container.appendChild(card);
            });

            // Save preference
            localStorage.setItem('preferred-lang', lang);
        }

        // Initialize language
        const savedLang = localStorage.getItem('preferred-lang');
        const browserLang = navigator.language || navigator.userLanguage;
        let defaultLang = 'en';

        if (savedLang === 'en' || savedLang === 'es') {
            defaultLang = savedLang;
        } else if (browserLang.startsWith('es')) {
            defaultLang = 'es';
        }

        setLanguage(defaultLang);
    </script>
